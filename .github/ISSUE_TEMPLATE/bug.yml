name: Bug report
description: Report a reproducible problem or incorrect result.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include steps and a synthetic or redacted example; omit private data and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include version, operating system, and relevant sanitized output.
